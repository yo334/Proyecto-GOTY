<!DOCTYPE html>
<!--
    Página de los ganadores de un año. Es UNA sola página para todos los años:
    años.html?y=2015 muestra 2015. js/anio.js dibuja las categorías
    leyendo datos/2015.json (igual que encuesta.html).
-->
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GOTY – The Game Awards</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:ital,wght@0,300;0,400;0,600;1,300&amp;display=swap"
        rel="stylesheet" />
    <link href="Css/style.css" rel="stylesheet" />
</head>

<body>
    <!-- ═════════════════════════════════════ MENÚ SUPERIOR ═════════════════════════════════════ -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="nav-logo-link">
                <img src="imagenes/logo_white.png" alt="The Game Awards" class="nav-logo">
            </a>
        </div>
        <div class="nav-right">
            <!-- Buscador dentro de la barra de navegación -->
            <div class="nav-search-container" id="nav-search-container">
                <div class="search-panel" id="search-panel">
                    <div class="search-panel__input-wrap">
                        <svg class="search-panel__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="search-input" class="search-panel__input" placeholder="Buscar..."
                            autocomplete="off" />
                        <button class="search-panel__close" id="search-close" aria-label="Cerrar búsqueda">✕</button>
                    </div>
                    <div class="search-panel__results" id="search-results"></div>
                </div>
            </div>

            <button class="nav-link nav-search-toggle" id="nav-search-toggle" aria-label="Buscar">
                <svg class="nav-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <span>BUSCAR</span>
            </button>
            <a href="index.html#years-section" class="nav-link">VER GANADORES</a>
            <a href="seleccionar_encuesta.html" class="nav-link">VOTAR</a>
        </div>
    </nav>
    <section class="hero">
        <h1>The Game Awards<br /><span id="anio-titulo"></span></h1>
    </section>
    <div class="divider"></div>
    <section class="winners-showcase" id="ganadores">
        <!-- Las categorías y los nominados los agrega js/anio.js -->
    </section>
    <div class="divider"></div>
    <section class="survey-banner-section">
        <a class="survey-banner" href="encuesta.html" id="link-encuesta">
            <h2 class="survey-banner__title">¿Estás de acuerdo con los ganadores? Votá por tus ganadores acá</h2>
            <p class="survey-banner__desc">Votar por mis favoritos de <span class="anio-actual"></span></p>
        </a>
    </section>
    <footer>
        © GOTY Archive &nbsp;·&nbsp; The Game Awards <span class="anio-actual"></span>
    </footer>
    <!-- Código JavaScript -->
    <!-- search.js va primero: anio.js usa sus constantes (PRIMER_ANIO, INFO_CATEGORIAS) -->
    <script src="js/search.js"></script>
    <script src="js/anio.js"></script>
</body>

</html>
