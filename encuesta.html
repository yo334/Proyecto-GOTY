<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encuesta GOTY — The Game Awards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="Css/encuesta.css" />
</head>

<body>
        <!-- ═══════════════════ TOP NAV ═══════════════════ -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="nav-logo-link">
                <img src="imagenes/logo_white.png" alt="The Game Awards" class="nav-logo">
            </a>
        </div>
        <div class="nav-right">
            <!-- Inline Search Box -->
            <div class="nav-search-container" id="nav-search-container">
                <div class="search-panel" id="search-panel">
                    <div class="search-panel__input-wrap">
                        <svg class="search-panel__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="search-input" class="search-panel__input"
                            placeholder="Buscar..." autocomplete="off" />
                        <button class="search-panel__close" id="search-close" aria-label="Cerrar búsqueda">✕</button>
                    </div>
                    <div class="search-panel__results" id="search-results"></div>
                </div>
            </div>
            
            <button class="nav-link nav-search-toggle" id="nav-search-toggle" aria-label="Buscar">
                <svg class="nav-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <span>BUSCAR</span>
            </button>
            <a href="index.html#years-section" class="nav-link">VER GANADORES</a>
            <a href="seleccionar_encuesta.html" class="nav-link">VOTAR</a>
        </div>
    </nav>

    <section class="hero">
        <h1>The Game Awards<br>Encuesta</h1>
        <p class="enc-subtitle">Elige a tus ganadores favoritos de cada año</p>
    </section>

    <div class="divider"></div>

    <div class="enc-tabs" id="yearTabs" role="tablist" aria-label="Selector de año de encuesta"></div>

    <div id="yearPanels" class="survey-categories"></div>

    <section class="enc-actions survey-actions">
        <div class="enc-actions-buttons">
            <button id="submit-survey" class="btn-submit enc-btn" type="button">Enviar mi votación</button>
            <button id="reset-survey" class="enc-btn enc-btn--reset" type="button">Reiniciar votos</button>
        </div>
        <div id="surveyFeedback" class="survey-feedback" role="status" aria-live="polite"></div>
    </section>

    <footer>
        &copy; GOTY Archive &nbsp;·&nbsp; Encuesta interactiva The Game Awards 2014–2025
    </footer>

    <script src="js/encuesta.js"></script>
    <!-- Scripts -->
    <script src="js/search.js"></script>
    <script>
        // Search overlay toggle
        const toggleBtn = document.getElementById('nav-search-toggle');
        const searchContainer = document.getElementById('nav-search-container');
        const closeBtn  = document.getElementById('search-close');
        const navSearchInput = document.getElementById('search-input');

        function openSearch(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            searchContainer.classList.add('active');
            setTimeout(() => navSearchInput.focus(), 120);
        }
        function closeSearch(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            searchContainer.classList.remove('active');
        }

        if(toggleBtn) toggleBtn.addEventListener('click', openSearch);
        if(closeBtn) closeBtn.addEventListener('click', closeSearch);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); });

        // Nav shrink on scroll
        const topNav = document.querySelector('.top-nav');
        if(topNav) {
            window.addEventListener('scroll', () => {
                topNav.classList.toggle('top-nav--scrolled', window.scrollY > 60);
            });
        }
    </script>
</body>

</html>
